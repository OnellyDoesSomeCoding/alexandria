[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mangadl"
version = "0.2.0"
description = "Download chapters from weebcentral.com and bundle them into one bookmarked PDF."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "Pillow>=10.0",
    "img2pdf>=0.5",
    "pikepdf>=8.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mangadl = "mangadl.__main__:main"
mangadl-web = "mangadl.web:main"

[tool.setuptools]
packages = ["mangadl"]

[tool.setuptools.package-data]
mangadl = ["static/*"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = ["missing-module-docstring", "missing-class-docstring", "missing-function-docstring"]
